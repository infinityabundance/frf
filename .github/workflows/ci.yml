# CI for the frf suites:
#
#   regression  - cargo test (invariant bank + golden path + the independent
#                 verifier tests) and the deterministic in-repo fuzz harness
#                 at scale
#   verification- verify_tree re-derives the checked-in evidence tree with
#                 the tool's own pure functions (freshness gate: if generated
#                 artifacts drift from the code, this fails); the demo job
#                 additionally regenerates the tree, verifies it, and runs
#                 the independent xtask verifier against the bundle + corpus
#   go-verifier - the THIRD triangle point: a Go implementation that shares
#                 no parsing library with either Rust implementation runs
#                 gofmt/vet/tests and passes the conformance corpus on the
#                 checked-in corpus; the demo job additionally runs it
#                 against the freshly regenerated bundle + corpus
#   fuzzing     - libFuzzer smoke runs of all three targets (yaml_types,
#                 cli_args, store_ids) under nightly
#
# Plus: rustfmt, clippy -D warnings, the MSRV floor, and `cargo package` so
# the publishable artifact can never rot.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Regression + verification + package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Format (xtask)
        run: cargo fmt --manifest-path xtask/Cargo.toml --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (xtask, deny warnings)
        run: cargo clippy --manifest-path xtask/Cargo.toml --all-targets -- -D warnings
      - name: Regression + golden path + verification + deterministic fuzz
        run: cargo test
      - name: Deterministic fuzz harness at scale
        run: FRF_FUZZ_ITERS=100000 cargo test --test fuzz
      - name: Publishable package must always build
        run: cargo package

  msrv:
    name: "MSRV (rust-version: 1.85)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Check on the declared MSRV
        run: cargo check --all-targets
      - name: MSRV for the independent verifier
        run: cargo check --manifest-path xtask/Cargo.toml --all-targets

  demo:
    name: Golden path + regenerated-tree verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the full canonical loop (regenerates the frf/ tree)
        run: ./golden/demo.sh
      - name: Verify the regenerated tree is self-consistent
        run: cargo test --test verify_tree
      - name: Independent verifier agrees on the regenerated bundle + corpus
        run: |
          cargo xtask verify bundle golden/work/portable.frf
          cargo xtask verify bundle golden/work/portable-single.frf
          cargo xtask verify corpus conformance
      - name: The Go verifier agrees on the regenerated bundle + corpus
        working-directory: verifier-go
        run: |
          go test ./...
          go run . verify bundle ../golden/work/portable.frf
          go run . verify bundle ../golden/work/portable-single.frf
          go run . verify corpus ../conformance
      - name: The empirical program — seeded mutations over the cross-domain corpus
        run: |
          cargo xtask experiment golden/work/experiment.json
      - name: The external empirical program — real historical defects across domains
        run: |
          cargo xtask external-experiment golden/work/external-experiment.json
      - name: The external empirical program v2 — version ladders, environment matrices, authority transitions
        run: |
          cargo xtask external-experiment-v2 golden/work/external-experiment-v2.json
      - name: The OCI execution profile — the side runs inside the digest-pinned image
        env:
          FRF_TEST_OCI: "1"
        run: |
          RUNTIME=podman; podman --version >/dev/null 2>&1 || RUNTIME=docker
          $RUNTIME image inspect docker.io/library/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662 >/dev/null 2>&1 || $RUNTIME pull docker.io/library/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          cargo test --test execution_profile -- oci

  v3-gate:
    name: V3 publication-integrity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Hosted CI deliberately does NOT execute the v3–v5 empirical programs
      # (they construct and run historically vulnerable software). A green
      # badge instead establishes EXACTLY this checklist — the publication
      # boundary is intact and the prohibited payloads never entered the
      # tracked tree in any form:
      - name: "V3 publication-integrity gate (empirical replay intentionally NOT executed)"
        run: |
          echo "What a green badge establishes:"
          echo "  ✓ prohibited historical build products absent"
          echo "  ✓ prohibited artifact hashes do not exist as Git blobs/CAS payloads"
          echo "  ✓ source hashes declared"
          echo "  ✓ reconstruction recipes present"
          echo "  ✓ expected artifact hashes declared"
          echo "  ✓ safe evidence documents canonical/valid"
          echo "  ✓ detached-object references resolve structurally"
          echo "  ℹ empirical replay intentionally not executed in hosted CI"
          cargo test --test v3_publication_integrity -- --nocapture
          cargo test --test prohibited_payloads

  go-verifier:
    name: "Go verifier: the third triangle point"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verifier-go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: verifier-go/go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Tests (corpus pins + bundle tests when the golden bundle is present)
        run: go test ./...
      - name: The Go verifier passes the conformance corpus
        run: go run . verify corpus ../conformance

  fuzz:
    name: libFuzzer smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Build fuzz targets
        run: cargo +nightly fuzz build
      - name: Fuzz YAML deserializers
        run: cargo +nightly fuzz run yaml_types -- -max_total_time=60
      - name: Fuzz CLI parser
        run: cargo +nightly fuzz run cli_args -- -max_total_time=60
      - name: Fuzz id/path safety
        run: cargo +nightly fuzz run store_ids -- -max_total_time=60
