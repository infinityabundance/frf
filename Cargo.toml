[package]
name = "frf"
version = "0.1.27"
edition = "2021"
description = "Minimal reference implementation of the Forensic Residual Framework kernel: authority -> court -> capture -> residual -> endoduction -> disposition -> receipt -> claim."
license = "MIT OR Apache-2.0"
repository = "https://github.com/infinityabundance/frf"
readme = "README.md"
keywords = ["forensic", "evidence", "compatibility", "differential-testing", "verification"]
categories = ["development-tools::testing", "command-line-utilities"]
rust-version = "1.85"

[[bin]]
name = "frf"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
# Comparator extension protocol: raw side streams are passed to external
# comparator programs base64-encoded inside canonical JSON requests.
base64 = "0.22"
# Single-file bundles: the OpenReceipt closure sealed as one deterministic
# tar archive (the manifest inside declares the container).
tar = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Integration tests re-pack tampered archives to prove the single-file
# bundle's hash sealing (the same `tar` crate the engine ships).
tar = "0.4"
# No jsonschema dev-dependency: every released version resolves url to 2.5.x,
# which unconditionally enables idna's `compiled_data` feature -> ICU
# (idna_adapter 1.2.2 and icu_* 2.3.0 require rustc 1.86/1.88), breaking the
# 1.85 MSRV. tests/conformance.rs therefore validates the OpenReceipt corpus
# with a fail-closed subset validator that audits the schema itself: any
# keyword outside {type, required, properties, additionalProperties, items,
# enum, const, pattern, $ref} is a test failure, never a silent skip. The
# corpus in conformance/ remains the normative cross-implementation artifact.

[profile.release]
lto = true
strip = true
