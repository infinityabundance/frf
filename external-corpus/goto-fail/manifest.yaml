court:
  id: ssl-handshake-check
  question: >-
    For the TLS handshake record family, does the candidate accept exactly
    the records the reference accepts?
  falsifier: >-
    The candidate's verdict diverges on some handshake record.
  authority: ref-ssl-2014
  candidate:
    name: cand
    version_or_commit: "1.0"
    build_profile: debug
    path: {candidate}
  fixture:
    id: handshake.conf
    path: fixtures/{fixture}
    arguments: ["{fixture}"]
  environment_points:
    utc:
      TZ: UTC
      LANG: C
    new-york:
      TZ: America/New_York
      LANG: en_US.UTF-8
    tokyo:
      TZ: Asia/Tokyo
      LANG: ja_JP.UTF-8
  admissibility_envelope:
    fixture_family: tls-handshake
    platforms: ["x86_64-linux"]
    observables: [exit, stderr]
    normalizers: []
    replay_scope: single-run
