court:
  id: heartbeat-responder
  question: >-
    For the heartbeat-record family, does the candidate emit the same wire
    response as the reference on every record?
  falsifier: >-
    The candidate's emitted bytes diverge from the reference's on some
    heartbeat record.
  authority: ref-openssl-2014
  candidate:
    name: cand
    version_or_commit: "1.0"
    build_profile: debug
    path: {candidate}
  fixture:
    id: heartbeat.conf
    path: fixtures/{fixture}
    arguments: ["{fixture}"]
  admissibility_envelope:
    fixture_family: heartbeat-record
    platforms: ["x86_64-linux"]
    observables: [bytes.wire]
    normalizers: []
    replay_scope: single-run
mutations:
  - id: heartbeat-bounds-check
    relation: bounds-check-removal
    relation_version: "1"
    target_axes: [bytes.wire]
    program: mutation.py
