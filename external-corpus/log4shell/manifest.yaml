court:
  id: lookup-resolver
  question: >-
    For the configuration-lookup family, does the candidate resolve
    ${key} lookups to the same configuration as the reference?
  falsifier: >-
    The candidate's resolved configuration diverges on some lookup.
  authority: ref-log4j-2021
  candidate:
    name: cand
    version_or_commit: "1.0"
    build_profile: debug
    path: {candidate}
  fixture:
    id: config.conf
    path: fixtures/{fixture}
    arguments: ["{fixture}"]
  admissibility_envelope:
    fixture_family: lookup-resolution
    platforms: ["x86_64-linux"]
    observables: [structured.state]
    normalizers: []
    replay_scope: single-run
mutations:
  - id: lookup-cycle-guard
    relation: cycle-guard-removal
    relation_version: "1"
    target_axes: [structured.state]
    program: mutation.py
