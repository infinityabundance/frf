court:
  id: thruster-command
  question: >-
    For the thruster-command family, does the candidate produce the same
    newton-second telemetry as the reference on every command?
  falsifier: >-
    The candidate's telemetry diverges on some command.
  authority: ref-mco-1999
  candidate:
    name: cand
    version_or_commit: "1.0"
    build_profile: debug
    path: {candidate}
  fixture:
    id: telemetry.conf
    path: fixtures/{fixture}
    arguments: ["{fixture}"]
  environment_points:
    utc:
      TZ: UTC
      LANG: C
    new-york:
      TZ: America/New_York
      LANG: en_US.UTF-8
    tokyo:
      TZ: Asia/Tokyo
      LANG: ja_JP.UTF-8
  admissibility_envelope:
    fixture_family: thruster-command
    platforms: ["x86_64-linux"]
    observables: [structured.state]
    normalizers: []
    replay_scope: single-run
mutations:
  - id: unit-conversion
    relation: unit-conversion-removal
    relation_version: "1"
    target_axes: [structured.state]
    program: mutation.py
