court:
  id: env-import-check
  question: >-
    For the environment-import family, does the candidate import function
    definitions with the same behavior as the reference?
  falsifier: >-
    The candidate's import executes code the reference leaves inert.
  authority: ref-shellshock-2014
  candidate:
    name: cand
    version_or_commit: "1.0"
    build_profile: debug
    path: {candidate}
  fixture:
    id: import.conf
    path: fixtures/{fixture}
    arguments: ["{fixture}"]
  environment_points:
    utc:
      TZ: UTC
      LANG: C
    new-york:
      TZ: America/New_York
      LANG: en_US.UTF-8
    tokyo:
      TZ: Asia/Tokyo
      LANG: ja_JP.UTF-8
  admissibility_envelope:
    fixture_family: env-import
    platforms: ["x86_64-linux"]
    observables: [stdout, exit]
    normalizers: []
    replay_scope: single-run
