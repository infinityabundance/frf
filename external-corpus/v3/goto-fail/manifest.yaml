court:
  id: ssl-handshake-check
  question: >-
    For the TLS handshake record family, does the candidate's verifier
    preserve the fixed reference's exit class and stderr diagnostic on the
    tampered-signature trigger?
  falsifier: >-
    The candidate accepts a handshake record whose signature does not match
    its data (CVE-2014-1266), diverging on exit and stderr.
  authority: ref-ssl-2014-1.0.1
  candidate:
    name: cand-ssl-buggy
    version_or_commit: "1.0.1x"
    build_profile: release
    path: {candidate}
  fixture:
    id: handshake.conf
    path: fixtures/{fixture}
    arguments: ["{fixture}"]
  environment:
    PATH: /usr/bin:/bin
  environment_points:
    utc:
      TZ: UTC
      LANG: C
    new-york:
      TZ: America/New_York
      LANG: en_US.UTF-8
    tokyo:
      TZ: Asia/Tokyo
      LANG: ja_JP.UTF-8
  admissibility_envelope:
    fixture_family: tls-handshake
    platforms: ["x86_64-linux"]
    observables: [exit, stderr]
    normalizers: []
    replay_scope: single-run
