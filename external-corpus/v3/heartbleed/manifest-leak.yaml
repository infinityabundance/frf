court:
  id: heartbeat-leak-check
  question: >-
    For the malformed-heartbeat trigger in fixture family heartbeat, does the
    candidate's linked TLS library preserve the fixed reference's behavior on
    the two leak observables (CVE-2014-0160) — judged SEMANTICALLY, never by
    a byte diff?
  falsifier: >-
    The candidate's linked library answers the malformed heartbeat
    (tls.heartbeat.illegal_response) or echoes the probe's planted synthetic
    canary bytes (memory.leak.seeded_canary) where the fixed reference
    discards it.
  authority: ref-hb-1.0.1g
  candidate:
    name: cand-hb
    version_or_commit: "1.0.1x"
    build_profile: release
    path: {candidate}
  fixture:
    id: defect.conf
    path: fixtures/defect.conf
    arguments: ["{fixture}"]
  environment:
    PATH: /usr/bin:/bin
  environment_points:
    utc:
      TZ: UTC
      LANG: C
    new-york:
      TZ: America/New_York
      LANG: en_US.UTF-8
    tokyo:
      TZ: Asia/Tokyo
      LANG: ja_JP.UTF-8
  admissibility_envelope:
    fixture_family: heartbeat
    platforms: ["x86_64-linux"]
    observables: [tls.heartbeat.illegal_response, memory.leak.seeded_canary]
    normalizers: []
    replay_scope: single-run
comparators:
  - axis: tls.heartbeat.illegal_response
    relation: eq
    extractor: verdict-scan
    residual_classifier: text
    relation_version: "v1"
    program: comparators/heartbeat-verdict.py
  - axis: memory.leak.seeded_canary
    relation: eq
    extractor: canary-scan
    residual_classifier: text
    relation_version: "v1"
    program: comparators/heartbeat-canary.py
minimizers:
  - id: leak-minimize
    relation: reduce-claimed-payload-length
    relation_version: "v1"
    program: minimizers/heartbeat-length.py
mutations:
  - id: seed-leak
    relation: seed-sensitive-leak
    relation_version: "v1"
    target_axes: [tls.heartbeat.illegal_response, memory.leak.seeded_canary]
    program: mutations/seed-leak.py
# The capture surface — the PUBLICATION BOUNDARY, declared per observed
# stream (spec/publication-surface.md). The probe NEVER writes raw process
# memory to an observed stream: stdout carries a safe synthetic projection
# (length + SHA-256 commitment + planted-canary observation) and stderr a
# diagnostic line. The declaration makes that contract part of the
# OBSERVATION: the published evidence records the leak's identity and the
# canary observation, never arbitrary leaked bytes.
capture_surface:
  - side: candidate
    stream: stdout
    policy: synthetic-publication
  - side: reference
    stream: stdout
    policy: inline
  - side: candidate
    stream: stderr
    policy: inline
  - side: reference
    stream: stderr
    policy: inline
