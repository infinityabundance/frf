court:
  id: heartbeat-leak-check
  question: >-
    For the malformed-heartbeat trigger in fixture family heartbeat, does the
    candidate's linked TLS library leak process memory in response
    (CVE-2014-0160) — judged SEMANTICALLY by the memory.leak.sensitive axis,
    not by a byte diff?
  falsifier: >-
    The candidate's linked library echoes process memory in response to the
    malformed heartbeat: the leak comparator sees the probe's HEARTBLEED
    verdict, a sensitive marker in the echoed content, or a high-entropy
    binary dump.
  authority: ref-hb-1.0.1g
  candidate:
    name: cand-hb
    version_or_commit: "1.0.1x"
    build_profile: release
    path: {candidate}
  fixture:
    id: defect.conf
    path: fixtures/defect.conf
    arguments: ["{fixture}"]
  environment:
    PATH: /usr/bin:/bin
  environment_points:
    utc:
      TZ: UTC
      LANG: C
    new-york:
      TZ: America/New_York
      LANG: en_US.UTF-8
    tokyo:
      TZ: Asia/Tokyo
      LANG: ja_JP.UTF-8
  admissibility_envelope:
    fixture_family: heartbeat
    platforms: ["x86_64-linux"]
    observables: [memory.leak.sensitive]
    normalizers: [strip-heap-noise]
    replay_scope: single-run
comparators:
  - axis: memory.leak.sensitive
    relation: eq
    extractor: leak-scan
    residual_classifier: text
    relation_version: "v1"
    program: comparators/heartbleed-leak.py
normalizers:
  - id: strip-heap-noise
    relation: mask-address-runs
    applies_to: stdout
    relation_version: "v1"
    program: normalizers/strip-heap-noise.py
minimizers:
  - id: leak-minimize
    relation: reduce-claimed-payload-length
    relation_version: "v1"
    program: minimizers/heartbeat-length.py
mutations:
  - id: seed-leak
    relation: seed-sensitive-leak
    relation_version: "v1"
    target_axes: [memory.leak.sensitive]
    program: mutations/seed-leak.py
