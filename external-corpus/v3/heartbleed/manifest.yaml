court:
  id: heartbeat-check
  question: >-
    For the malformed-heartbeat trigger in fixture family heartbleed, does
    the candidate's linked TLS library preserve the fixed reference's exit
    class and stderr diagnostic?
  falsifier: >-
    The candidate's linked library echoes process memory in response to the
    malformed heartbeat (CVE-2014-0160), diverging on exit and stderr.
  authority: ref-hb-1.0.1g
  candidate:
    name: cand-hb-1.0.1f
    version_or_commit: "1.0.1f"
    build_profile: release
    path: {candidate}
  fixture:
    id: probe.conf
    path: fixtures/{fixture}
    arguments: ["{fixture}"]
  # The DECLARED execution environment: the sides run under EXACTLY this
  # environment (the ambient host environment is never inherited — it is
  # not evidence). The environment-matrix coordinates are declared below;
  # the base environment is the trigger-free baseline.
  environment:
    PATH: /usr/bin:/bin
  environment_points:
    utc:
      TZ: UTC
      LANG: C
    new-york:
      TZ: America/New_York
      LANG: en_US.UTF-8
    tokyo:
      TZ: Asia/Tokyo
      LANG: ja_JP.UTF-8
  admissibility_envelope:
    fixture_family: heartbeat
    platforms: ["x86_64-linux"]
    observables: [exit, stderr]
    normalizers: []
    replay_scope: single-run
