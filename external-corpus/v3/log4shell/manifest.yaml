court:
  id: jndi-lookup-check
  question: >-
    For the JNDI-lookup trigger in fixture family log4shell, does the
    candidate's logging stack perform the lookup exactly when the fixed
    reference performs it (CVE-2021-44228) — judged SEMANTICALLY on the
    jndi.lookup observable, never by a byte diff?
  falsifier: >-
    The candidate resolves a JNDI lookup expression in a log message at log
    time where the fixed reference logs it literally.
  authority: ref-log4j-2.17.1
  candidate:
    name: cand-log4j-2.14.1
    version_or_commit: "2.14.1"
    build_profile: release
    path: {candidate}
  fixture:
    id: defect.conf
    path: fixtures/defect.conf
    arguments: ["{fixture}"]
  environment:
    PATH: /usr/bin:/bin
  environment_points:
    utc:
      TZ: UTC
      LANG: C
    new-york:
      TZ: America/New_York
      LANG: en_US.UTF-8
    tokyo:
      TZ: Asia/Tokyo
      LANG: ja_JP.UTF-8
  admissibility_envelope:
    fixture_family: jndi
    platforms: ["x86_64-linux"]
    observables: [jndi.lookup]
    normalizers: []
    replay_scope: single-run
comparators:
  - axis: jndi.lookup
    relation: eq
    extractor: jndi-scan
    residual_classifier: text
    relation_version: "v1"
    program: comparators/jndi-lookup.py
minimizers:
  - id: jndi-message-minimize
    relation: reduce-message-suffix
    relation_version: "v1"
    program: minimizers/jndi-message.py
mutations:
  - id: jndi-inject
    relation: seed-jndi-lookup
    relation_version: "v1"
    target_axes: [jndi.lookup]
    program: mutations/jndi-inject.py
# The capture surface — the publication boundary, declared per observed
# stream (spec/publication-surface.md). The probe's streams are pure verdict
# lines (the lookup verdict on stdout, the identical log line on stderr) —
# no lookup payloads or class-path internals ever reach an observed stream.
# The declaration makes that contract part of the OBSERVATION.
capture_surface:
  - side: candidate
    stream: stdout
    policy: inline
  - side: reference
    stream: stdout
    policy: inline
  - side: candidate
    stream: stderr
    policy: inline
  - side: reference
    stream: stderr
    policy: inline
