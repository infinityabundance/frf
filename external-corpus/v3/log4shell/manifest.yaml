court:
  id: jndi-check
  question: >-
    For the JNDI-lookup trigger in fixture family log4shell, does the
    candidate's Log4j preserve the fixed reference's stdout and exit class?
  falsifier: >-
    The candidate's Log4j performs the JNDI lookup at log time
    (CVE-2021-44228), diverging on stdout.
  authority: ref-log4j-2.17.1
  candidate:
    name: cand-log4j-2.14.1
    version_or_commit: "2.14.1"
    build_profile: release
    path: {candidate}
  fixture:
    id: message.conf
    path: fixtures/{fixture}
    arguments: ["{fixture}"]
  # The DECLARED execution environment: the sides run under EXACTLY this
  # environment (the ambient host environment is never inherited — it is
  # not evidence). PATH resolves `java` for the launcher; the
  # environment-matrix coordinates are declared below.
  environment:
    PATH: /usr/bin:/bin
  environment_points:
    utc:
      TZ: UTC
      LANG: C
    new-york:
      TZ: America/New_York
      LANG: en_US.UTF-8
    tokyo:
      TZ: Asia/Tokyo
      LANG: ja_JP.UTF-8
  admissibility_envelope:
    fixture_family: jndi
    platforms: ["x86_64-linux"]
    observables: [stdout, exit]
    normalizers: []
    replay_scope: single-run
