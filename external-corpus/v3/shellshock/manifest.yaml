court:
  id: env-import-check
  question: >-
    For the environment-import trigger in fixture family shellshock, does
    the candidate bash preserve the fixed reference's stdout and exit class?
  falsifier: >-
    The candidate's function import from the environment evaluates trailing
    code the fixed reference leaves inert (CVE-2014-6271), diverging on
    stdout.
  authority: ref-bash-4.3.30
  candidate:
    name: cand-bash-4.3.0
    version_or_commit: "4.3.0"
    build_profile: release
    path: {candidate}
  fixture:
    id: import.trigger
    path: fixtures/{fixture}
    arguments: ["{fixture}"]
  # The DECLARED execution environment: the sides run under EXACTLY this
  # environment (the ambient host environment is never inherited — it is
  # not evidence). The CVE-2014-6271 trigger is a DECLARED environment
  # variable: the staging step fills the `{trigger}` placeholder into the
  # defect manifests and REMOVES it from the clean-control manifest — the
  # trigger is evidence, not orchestration, and a new execution engine
  # reproduces the observation from the evidence alone.
  environment:
    PATH: /usr/bin:/bin
    x: "{trigger}"
  environment_points:
    utc:
      TZ: UTC
      LANG: C
    new-york:
      TZ: America/New_York
      LANG: en_US.UTF-8
    tokyo:
      TZ: Asia/Tokyo
      LANG: ja_JP.UTF-8
  admissibility_envelope:
    fixture_family: env-import
    platforms: ["x86_64-linux"]
    observables: [stdout, exit]
    normalizers: []
    replay_scope: single-run
