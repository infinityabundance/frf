# Resolution court declaration: the same court question, run against the
# patched candidate (golden/work/candidate-fixed.sh, generated by the demo).
# This run provides the closure evidence a `fixed` disposition must point at:
# its captures show the exit axis now agreeing with the reference.
#
# Path rules (v0): all paths are relative to the working directory the
# commands are run from (the repository root for the golden path).
court:
  id: cli-malformed-input
  question: >-
    For malformed input in fixture family malformed-input, does the candidate
    preserve the admitted reference's exit class and first diagnostic line?
  falsifier: >-
    The candidate's exit class or first diagnostic line diverges from the
    admitted reference on a fixture in family malformed-input.
  authority: ref-cli-1.8.2
  candidate:
    name: cand-cli
    version_or_commit: "0.1.0-fixed"
    build_profile: debug
    path: golden/work/candidate-fixed.sh
  fixture:
    id: malformed-path.conf
    path: frf/courts/cli-malformed-input/fixtures/malformed-path.conf
    arguments: ["--strict", "{fixture}"]
  admissibility_envelope:
    fixture_family: malformed-input
    platforms: ["x86_64-linux"]
    observables: [exit, stderr]
    normalizers: []
    replay_scope: single-run
