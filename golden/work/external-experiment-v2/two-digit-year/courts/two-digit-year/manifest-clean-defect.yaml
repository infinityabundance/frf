court:
  id: date-parser
  question: >-
    For the date-parsing family, does the candidate emit the same
    ISO date as the reference on every input?
  falsifier: >-
    The candidate's parsed date diverges on some input.
  authority: ref-dateparser-2000
  candidate:
    name: cand
    version_or_commit: "1.0"
    build_profile: debug
    path: scripts/candidate-clean.sh
  fixture:
    id: date.conf
    path: fixtures/defect.date
    arguments: ["{fixture}"]
  admissibility_envelope:
    fixture_family: date-parsing
    platforms: ["x86_64-linux"]
    observables: [structured.state]
    normalizers: []
    replay_scope: single-run
mutations:
  - id: y2k-window
    relation: y2k-window-removal
    relation_version: "1"
    target_axes: [structured.state]
    program: mutation.py
