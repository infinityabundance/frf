[package]
name = "xtask"
version = "0.1.77"
edition = "2021"
description = "The independent FRF verifier — a deliberately small SECOND implementation of the FRF protocol, with no dependency on the frf reference engine."
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.85"

[dependencies]
serde = "1"
serde_json = "1"
sha2 = "0.10"
# Single-file bundles: the independent verifier opens the same sealed tar
# container the reference engine ships.
tar = "0.4"
base64 = "0.22"
# The v5 benchmark protocol measures child CPU time (getrusage(RUSAGE_CHILDREN)
# deltas) — a platform crate, not a parsing library; the verifier's
# independence claim is about evidence parsing, not libc.
libc = "0.2"
